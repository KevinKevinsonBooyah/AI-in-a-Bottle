.minibody.is-stealth .advanced summary small,.minibody.is-stealth .advanced summary{color:#c0eee5!important}
.minibody.is-stealth .advanced[open] summary{border-bottom-color:#378184!important}
.minibody.is-stealth .local-guide code,.minibody.is-stealth .local-config code{background:#092d3a!important;color:#b9f9ea!important;border-color:#37858a!important}
.minibody.is-stealth .nav button{border-right-color:#235c6c!important}
.minibody.is-stealth .net .dot{background:#48d9c7!important}

/* 2026: Small-window mode, disabled images, and an in-chat strength picker */
.launch-presets{flex-wrap:wrap}
.launch-presets .launch-size{min-width:94px;flex:1}
.browser-quickbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:5px 8px;background:#d4ecdf;color:#143c3f;border-bottom:1px solid #79aaa1;font:700 10px system-ui}
.browser-quickbar[hidden]{display:none!important}
.browser-quickbar label{white-space:nowrap}
.browser-quickbar select{font-size:11px;max-width:125px;min-width:76px;flex:1;border:1px solid #5e9794;border-radius:5px;padding:3px;background:#f5fffa;color:#123c46}
.browser-quickbar span{font-size:9px;font-weight:400;flex:1 0 100%}
.minibody.is-stealth .browser-quickbar{background:#092e3c;border-color:#287880;color:#b9f5e7}
.minibody.is-stealth .browser-quickbar select{background:#113f4b;color:#dcf9ed;border-color:#43958f}
.minibody .actions button:disabled,.minibody .actions button[aria-disabled="true"]{opacity:.32!important;cursor:not-allowed!important;filter:grayscale(1)!important;pointer-events:none!important;box-shadow:none!important}
@media(max-width:260px){.minibody .bar{min-height:25px}.minibody .nav button{padding:4px 1px;font-size:9px}.minibody .actions{gap:2px}.minibody .actions button{font-size:9px;padding:4px 3px}.minibody .composer{padding:3px}.minibody .entry textarea{min-height:34px}.browser-quickbar{padding:3px 4px}.browser-quickbar select{font-size:10px}}

/* Live Box Capture: video stays live until the user finishes drawing; auto-submit on release. */
.crop-surface video.crop-live{display:block;max-width:100%;max-height:calc(100dvh - 105px);width:auto;height:auto;object-fit:contain;user-select:none;pointer-events:none}
.live-crop-overlay .crop-stage{overflow:hidden}
.live-crop-overlay .crop-selection{border-color:#76f1cf;background:#3aebc126;box-shadow:0 0 0 9999px #02182274}
.live-crop-overlay .crop-help{font:600 10px/1.5 system-ui;color:#baf6e8}
</style>

<li class="setup-step"><b>Install Ollama (personal PC only).</b><p>Open the <a href="https://ollama.com/download/windows" target="_blank" rel="noopener noreferrer">official Windows installer</a>. Download, install, and open <b>Ollama</b> from Start. It runs in the background. For current Windows requirements see <a href="https://docs.ollama.com/windows" target="_blank" rel="noopener noreferrer">Windows documentation</a>.</p></li>
<li class="setup-step"><b>Download the AI model.</b><p>Open Windows Terminal or PowerShell (Win + X → Terminal) and paste this command. The model is about 3.3 GB, plus additional space for Ollama.</p><div class="guide-command"><code id="pullCommand">ollama pull qwen3-vl:4b-instruct</code><button id="copyPull" type="button">Copy command</button></div><p>Confirmed model: <a href="https://ollama.com/library/qwen3-vl:4b-instruct" target="_blank" rel="noopener noreferrer">Qwen3-VL 4B Instruct</a>.</p></li>
<li class="setup-step"><b>Check Ollama is running.</b><p>Open <a href="http://127.0.0.1:11434/api/tags" target="_blank" rel="noopener noreferrer">http://127.0.0.1:11434/api/tags</a> on this same PC. You should see JSON with a list of installed models. If the page does not load, start Ollama from Windows Start.</p></li>
<li class="setup-step"><b>Allow this GitHub Pages site, then test.</b><p>On Windows, open <b>Edit environment variables for your account</b>. Under <b>User variables</b>, choose New. Name: <code>OLLAMA_ORIGINS</code>. Value: <code>https://kevinkevinsonbooyah.github.io</code>. Click OK, <b>Quit Ollama completely from the system tray</b>, and reopen it. This keeps Ollama bound to your own computer.</p><p>In Chrome, if prompted, allow this trusted site to access <b>local/loopback network</b>. Return here and press <b>Test connection</b>. See <a href="https://docs.ollama.com/faq#how-can-i-allow-additional-web-origins-to-access-ollama" target="_blank" rel="noopener noreferrer">Ollama's origin guide</a> and <a href="https://developer.chrome.com/docs/modern-web-guidance/guides/security/local-network-access" target="_blank" rel="noopener noreferrer">Chrome's local-network explanation</a>.</p></li>
</ol><p><b>If something fails:</b> press <b>Repair Ollama</b> for a connection check, then optionally download its Windows repair script. The script asks before installing. School PCs without software permission should use Gemini instead.</p><p id="copyCommandStatus" role="status" class="hint"></p></div></details>

 function browserAIIsRepeating(text){
  // Model degeneration guard: detect a short word pattern repeated many times.
  if(typeof text!=='string'||text.length<65)return false;
  const words=(text.toLowerCase().match(/[\p{L}\p{N}']+/gu)||[]);
  if(words.length<18)return false;
  const tail=words.slice(-100);
  for(let width=1;width<=12;width++){
   const copies=width<=2?8:width<=5?5:4;
   if(tail.length<width*copies)continue;
   const pattern=tail.slice(-width).join('\u0000');
   let recurring=true;
   for(let n=2;n<=copies;n++){
    if(tail.slice(-width*n,-width*(n-1)).join('\u0000')!==pattern){recurring=false;break;}
   }
   if(recurring)return true;
  }
  // Catch slightly varying loops that still recycle the same small set of phrases.
  if(words.length>=100){
   const recent=words.slice(-100),grams=new Set();
   for(let i=0;i<=recent.length-4;i++)grams.add(recent.slice(i,i+4).join(' '));
   if(grams.size<22)return true;
  }
  return false;
 }

 function classifyQuestion(txt,hasImage){

   if((hard&&((code||numbered||words>35)||/\bcomplex\b|\bdebug\b|step.by.step|nested/i.test(t)))||
      (code&&words>20)||(words>140)||(hasImage&&/complex|trace|pseudocode|code|algorithm|hard/i.test(t)))return 'complex';

 function cooldown(id,error,httpStatus,retryAfter){
   const msg=(error||'').toLowerCase();
   const n=Number(retryAfter);
   let ms=Number.isFinite(n)&&n>0?Math.min(n*1000,3600000):85000;
   if(/per day|daily|requests per day|rpd|quota exceeded|day quota/i.test(msg))ms=12*60*60*1000;
   else if(/permission|not found|not supported|not available|deprecated/i.test(msg)||httpStatus===404)ms=30*60*1000;
   blockedUntil.set(id,now()+ms);

 async function onlineAnswer(txt,img){

 {heading:'Procedures and parameters',patterns:['procedure','parameter','argument','function return'],keywords:['procedure','parameter'],answer:'A procedure is a named set of instructions. Parameters specify inputs; arguments are actual values passed when called. Procedures help manage complexity and reuse code.',example:'PROCEDURE add(a, b) { RETURN a + b } can be called as add(2, 5).'},

 {heading:'Random numbers',patterns:['random(', 'random number','random(a'],keywords:['random'],answer:'In AP CSP pseudocode, RANDOM(a, b) returns a uniformly distributed integer from a to b, inclusive.',example:'RANDOM(1, 6) models rolling a fair six-sided die.'},
 {heading:'Internet protocols',patterns:['protocol','tcp','ip packet','http','internet protocols'],keywords:['protocol','tcp','http'],answer:'Protocols are agreed-upon rules for communication. IP handles addressing/routing of packets, TCP provides reliable ordered delivery over IP, and HTTP defines web request/response messages. HTTPS protects HTTP traffic using TLS.',example:'A browser requests a webpage using HTTPS, and data travels as packets.'},
 {heading:'DNS',patterns:['dns','domain name system','domain to ip'],keywords:['dns','domain'],answer:'The Domain Name System maps hostnames to IP addresses using a distributed, hierarchical system. It makes it practical to use readable website names.',example:'DNS can resolve example.com to an IP address used for communication.'},
 {heading:'Packets and routing',patterns:['packet','router','routing','path across'],keywords:['packet','route','router'],answer:'Information on networks is broken into packets. Routers forward them using addressing and routing information. Different packets may take different paths; they can be reassembled at the destination.',example:'Packets can take alternate routes if a network link fails.'},
 {heading:'Fault tolerance and redundancy',patterns:['fault tolerance','redundancy','multiple paths'],keywords:['fault','redundancy'],answer:'Fault-tolerant systems keep working despite some component failures. Redundant components and network paths can increase reliability.',example:'An alternate network route can help communication continue after one path goes down.'},
 {heading:'Parallel and distributed computing',patterns:['parallel computing','distributed computing','speedup'],keywords:['parallel','distributed'],answer:'Parallel computing runs parts of a task simultaneously; distributed computing uses multiple connected machines. Coordinating tasks has overhead, so speedup is not always linear.',example:'Splitting independent data processing among several machines can finish a job faster.'},

 {heading:'Digital divide',patterns:['digital divide','unequal internet access'],keywords:['divide','access'],answer:'The digital divide refers to unequal access to computing devices, connectivity, and the skills to use them, which can amplify social and economic inequality.',example:'Students without reliable home internet may have fewer opportunities for online learning.'},

 {heading:'Bias in computing',patterns:['algorithmic bias','bias','unfair data','machine learning'],keywords:['bias','ai'],answer:'Computing systems can reflect bias from their training data, chosen objectives, and design choices. Developers should test outcomes for different groups and consider harms as well as benefits.',example:'A classifier trained mostly on one population may perform worse for others.'},

// Restricted AP-style pseudocode interpreter for simple trace exercises (no eval).
function traceCode(program){
 const vars=Object.create(null),out=[],lines=program.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(x=>x&&!x.startsWith('//'));let steps=0;
 function lex(expr){let t=expr.match(/(?:"[^"]*"|'[^']*'|\d+(?:\.\d+)?|[A-Za-z_]\w*|<=|>=|!=|==|←|[^\s])/g)||[];return t}
 function evalExpr(expr){let tok=lex(expr),i=0;
 function read(prec=0){let t=tok[i++];if(t===undefined)throw Error('Missing expression');let v;
 if(t==='('){v=read(0);if(tok[i++]!==')')throw Error('Missing )')}
 else if(t==='-'||t.toUpperCase()==='NOT'){let x=read(7);v=t==='-'?-Number(x):!x}
 else if(/^\d/.test(t))v=Number(t);
 else if(/^['"]/.test(t))v=t.slice(1,-1);
 else if(t.toUpperCase()==='TRUE')v=true;
 else if(t.toUpperCase()==='FALSE')v=false;
 else if(Object.hasOwn(vars,t))v=vars[t];
 else throw Error('Unknown variable/token '+t);
 const power={'OR':1,'AND':2,'=':3,'==':3,'!=':3,'<':3,'>':3,'<=':3,'>=':3,'+':4,'-':4,'*':5,'/':5,'MOD':5};
 while(i<tok.length){const op=tok[i].toUpperCase(),p=power[op]||0;if(p<=prec)break;i++;let rhs=read(p);switch(op){case '+':v=Number(v)+Number(rhs);break;case '-':v-=rhs;break;case '*':v*=rhs;break;case '/':v/=rhs;break;case 'MOD':v%=rhs;break;case '=':case '==':v=v===rhs;break;case '!=':v=v!==rhs;break;case '<':v=v<rhs;break;case '>':v=v>rhs;break;case '<=':v=v<=rhs;break;case '>=':v=v>=rhs;break;case 'AND':v=Boolean(v&&rhs);break;case 'OR':v=Boolean(v||rhs);break;}}
 return v}
 const result=read();if(i<tok.length)throw Error('Unsupported token '+tok[i]);return result}
 function runRange(from,to){let i=from;while(i<to){if(++steps>10000)throw Error('Exceeded 10,000 instructions');let line=lines[i];if(line==='{'||line==='}') {i++;continue}
 let r=line.match(/^REPEAT\s+(.+?)\s+TIMES\s*\{?$/i);if(r){let start=i+1;if(lines[start]==='{')start++;let depth=1,j=start;for(;j<to;j++){if(lines[j]==='{')depth++;if(lines[j]==='}')depth--;if(depth===0)break}if(j>=to)throw Error('Missing closing }');const n=evalExpr(r[1]);if(!Number.isSafeInteger(n)||n<0||n>10000)throw Error('Repeat count outside 0–10000');for(let k=0;k<n;k++)runRange(start,j);i=j+1;continue}
 r=line.match(/^DISPLAY\s*\((.*)\)\s*$/i);if(r){out.push(String(evalExpr(r[1])));i++;continue}
 r=line.match(/^([A-Za-z_]\w*)\s*(?:←|<-)\s*(.*?)$/);if(r){vars[r[1]]=evalExpr(r[2]);i++;continue}
 throw Error('Unsupported line: '+line)}}
 runRange(0,lines.length);
 return 'Output: '+(out.length?out.join(', '):'(nothing displayed)')+'\nFinal variables: '+JSON.stringify(vars)+'\nSteps executed: '+steps;
}
</script>
