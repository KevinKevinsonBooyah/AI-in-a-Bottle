const CLASSROOM_URL='https://classroom.google.com/u/3/h/st';
const $=id=>document.getElementById(id);
let miniWindow=null, stealth=false, quickHidden=false;
let panicClicks=[];
function setStealth(on){stealth=on;if(!on){document.title='AI in a Bottle';$('tabIcon').href=BOTTLE}}
function applyStealthTab(){document.title=stealth?'Home - Classroom':'AI in a Bottle';$('tabIcon').href=stealth?CLASSROOM:BOTTLE}
$('stealth').addEventListener('change',e=>setStealth(e.target.checked));
function panic(){
 if(!stealth)return;
 try{if(miniWindow&&!miniWindow.closed)miniWindow.close()}catch(e){}
 // The parent page is the actual tab: navigate it directly to Google Classroom.
 location.replace(CLASSROOM_URL);
}
function setQuickHidden(hidden){
 quickHidden=hidden;
 const fallback=$('fallback');
 fallback.classList.toggle('quick-hidden',quickHidden);
 if(miniWindow&&!miniWindow.closed){
   try{
     miniWindow.document.documentElement.classList.toggle('quick-hidden',quickHidden);
     if(quickHidden){miniWindow.blur();window.focus()}else{miniWindow.focus()}
   }catch(e){}
 }
}
function toggleQuickHide(){
 const fallbackVisible=$('fallback').classList.contains('active');
 if((!miniWindow||miniWindow.closed)&&!fallbackVisible)return;
 setQuickHidden(!quickHidden);
}
// Listeners are installed in both documents. The shared click queue means that
// three quick clicks can cross between the parent page and its popup.
function bindShortcuts(win){
 const doc=win.document;
 if(doc.__aiBottleShortcutsBound)return;
 doc.__aiBottleShortcutsBound=true;
 doc.addEventListener('pointerdown',event=>{
   if(event.button!==0||!stealth)return;
   const now=Date.now();
   panicClicks.push(now);
   panicClicks=panicClicks.filter(t=>now-t<=850);
   if(panicClicks.length>=3){panicClicks=[];event.preventDefault();panic()}
 },true);
 doc.addEventListener('contextmenu',event=>{
   if(event.button!==2 && event.pointerType==='touch')return;
   // Right click works in Ask, Study, Tools, Config, the home page and popup.
   event.preventDefault();
   toggleQuickHide();
 },true);
}
bindShortcuts(window);
function run(){
 applyStealthTab();
 if(miniWindow&&!miniWindow.closed){setQuickHidden(false);miniWindow.focus();return}
 let pop=null;try{pop=window.open('','AIInABottle','popup=yes,width=438,height=690,top=110,left=180,resizable=yes,scrollbars=no')}catch(e){}
 if(pop){
   miniWindow=pop;pop.document.open();pop.document.write('<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+ (stealth?'Home - Classroom':'AI in a Bottle') +'</title><link rel="icon" href="'+(stealth?CLASSROOM:BOTTLE)+'"><style>'+ $('miniStyles').textContent+'</style></head><body>'+ $('miniTemplate').innerHTML+'</body></html>');pop.document.close();
   bindShortcuts(pop);setQuickHidden(false);bootMini(pop);
   pop.focus();
 }else{$('miniStyles').media='all';const target=$('fallbackTarget');target.innerHTML=$('miniTemplate').innerHTML;const panel=$('fallback');panel.classList.add('active');setQuickHidden(false);$('fallbackClose').onclick=()=>{panel.classList.remove('active');setQuickHidden(false);target.innerHTML='';$('miniStyles').media='not all'};bootMini(window,target)}
}

 function cooldown(id,error,httpStatus,retryAfter){
   const msg=(error||'').toLowerCase();

   if(/per day|daily|requests per day|rpd|quota exceeded|day quota/i.test(msg))ms=12*60*60*1000;
   else if(/permission|not found|not supported|not available|deprecated/i.test(msg)||httpStatus===404)ms=30*60*1000;

 function runRange(from,to){let i=from;while(i<to){if(++steps>10000)throw Error('Exceeded 10,000 instructions');let line=lines[i];if(line==='{'||line==='}') {i++;continue}
 let r=line.match(/^REPEAT\s+(.+?)\s+TIMES\s*\{?$/i);if(r){let start=i+1;if(lines[start]==='{')start++;let depth=1,j=start;for(;j<to;j++){if(lines[j]==='{')depth++;if(lines[j]==='}')depth--;if(depth===0)break}if(j>=to)throw Error('Missing closing }');const n=evalExpr(r[1]);if(!Number.isSafeInteger(n)||n<0||n>10000)throw Error('Repeat count outside 0–10000');for(let k=0;k<n;k++)runRange(start,j);i=j+1;continue}
 r=line.match(/^DISPLAY\s*\((.*)\)\s*$/i);if(r){out.push(String(evalExpr(r[1])));i++;continue}
 r=line.match(/^([A-Za-z_]\w*)\s*(?:←|<-)\s*(.*?)$/);if(r){vars[r[1]]=evalExpr(r[2]);i++;continue}
 throw Error('Unsupported line: '+line)}}
 runRange(0,lines.length);
 return 'Output: '+(out.length?out.join(', '):'(nothing displayed)')+'\nFinal variables: '+JSON.stringify(vars)+'\nSteps executed: '+steps;
}
